[project]
name = "html2pdf-onepage"
version = "0.1.0"
description = "HTML to a single continuous PDF page: no paper-size breaks, no blank bands, vector output with selectable text."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "OpenWhale Labs" }]
keywords = ["html", "pdf", "playwright", "chromium", "single-page"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "playwright>=1.49",
    "img2pdf>=0.5",
]

[project.urls]
Homepage = "https://github.com/openwhale-labs/html2pdf"
Issues = "https://github.com/openwhale-labs/html2pdf/issues"

[project.scripts]
html2pdf = "html2pdf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/html2pdf"]

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
